<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" role="img" aria-label="Systemis">
  <!-- Rayons cardinaux - Emeraude -->
  <line x1="40" y1="23" x2="40" y2="7"  stroke="#00A878" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="40" y1="57" x2="40" y2="73" stroke="#00A878" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="57" y1="40" x2="73" y2="40" stroke="#00A878" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="23" y1="40" x2="7"  y2="40" stroke="#00A878" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Rayons diagonaux - Violet -->
  <line x1="50" y1="30" x2="61" y2="19" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="30" x2="19" y2="19" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="61" y2="61" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="19" y2="61" stroke="#7B2CBF" stroke-width="3" stroke-linecap="round"/>
  <!-- Coeur - cercle emeraude + S -->
  <circle cx="40" cy="40" r="13" fill="#00A878"/>
  <text x="40" y="47" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#0D0D0D">S</text>
  <!-- Wordmark -->
  <text x="92" y="50" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="700" letter-spacing="1.5" fill="#0D0D0D">SYSTEMIS</text>
</svg>
